<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>工厂订单安排与跟单管理系统</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/assets/wder-logo.jpg" />
    <script>
      (() => {
        try {
          const mode = localStorage.getItem("wder-theme-mode") || "auto";
          const hourText = new Intl.DateTimeFormat("en-US", {
            timeZone: "Asia/Shanghai",
            hour: "2-digit",
            hour12: false
          }).format(new Date());
          const hour = Number(hourText) === 24 ? 0 : Number(hourText);
          const resolved = mode === "auto" ? (hour >= 7 && hour < 19 ? "light" : "dark") : mode;
          document.documentElement.dataset.themeMode = mode;
          document.documentElement.dataset.theme = resolved;
        } catch {
          document.documentElement.dataset.themeMode = "auto";
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="/styles.css?v=20260904-4" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/app.js?v=20260904-4"></script>
  </body>
</html>
